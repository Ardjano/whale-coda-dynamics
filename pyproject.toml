[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whale-coda-dynamics"
version = "0.1.0"
description = "Sperm whale coda exchanges: own sequencing vs turn-taking (UvA MSc AI, Multilingual NLP)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
modeling = ["numpy>=1.26", "scipy>=1.12", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
